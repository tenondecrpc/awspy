name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CURRENT_EDITION: "2026"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Measure test coverage
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm run security:audit

      - name: Verify package signatures and attestations
        run: npm run security:signatures

      - name: Scan repository history for secrets
        # Gitleaks v8.30.1, pinned by image digest.
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=--all --redact --no-banner --no-color

      - name: Generate CycloneDX SBOM
        run: npm run sbom > sbom.cdx.json

      - name: Retain coverage and SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence
          path: |
            coverage/lcov.info
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      CURRENT_EDITION: "2026"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_SESSIONIZE_BASE_URL: "http://127.0.0.1:1/sessionize"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm run playwright:install

      - name: Verify production browser behavior
        run: npm run verify:e2e

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
